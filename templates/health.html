{% extends "base.html" %}
{% block title %}Health{% endblock %}
{% block content %}
<div class="p-4 space-y-4 max-w-5xl mx-auto">

  <div class="at-card p-5">
    <h2 class="text-base font-semibold text-gray-900 mb-3">Data Freshness</h2>
    <div id="freshness-table" class="space-y-1 text-xs at-mono"></div>
  </div>

  <div class="at-card p-5">
    <h2 class="text-base font-semibold text-gray-900 mb-3">Pipeline Status</h2>
    <div id="pipeline-table" class="space-y-1 text-xs at-mono"></div>
  </div>

  <div class="at-card p-5">
    <h2 class="text-base font-semibold text-gray-900 mb-3">Database</h2>
    <div id="db-table" class="space-y-1 text-xs at-mono"></div>
    <div id="db-size" class="text-xs text-gray-400 mt-2"></div>
  </div>

  <div class="at-card p-5">
    <h2 class="text-base font-semibold text-gray-900 mb-3">Configuration</h2>
    <div id="config-table" class="space-y-1 text-xs at-mono"></div>
  </div>

</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/health.js"></script>
{% endblock %}
