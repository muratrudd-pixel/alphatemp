{% extends "base.html" %}
{% block title %}Review{% endblock %}
{% block content %}

<!-- Filter Bar -->
<div class="flex items-center gap-2 mb-4">
    <button id="rr-7d" onclick="setReviewRange('7d')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-100 text-gray-500 hover:bg-gray-200">
        7d
    </button>
    <button id="rr-30d" onclick="setReviewRange('30d')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-900 text-white">
        30d
    </button>
    <button id="rr-all" onclick="setReviewRange('all')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-100 text-gray-500 hover:bg-gray-200">
        All
    </button>

    <div class="border-l border-gray-200 mx-2 self-stretch"></div>

    <button id="filter-all" onclick="setFilter('all')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-900 text-white">
        All
    </button>
    <button id="filter-worst" onclick="setFilter('worst')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-100 text-gray-500 hover:bg-gray-200">
        Worst Misses
    </button>
    <button id="filter-lost" onclick="setFilter('lost')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-100 text-gray-500 hover:bg-gray-200">
        Lost Bets
    </button>
    <button id="filter-missed" onclick="setFilter('missed')"
            class="px-3 py-1 text-xs uppercase tracking-wider rounded bg-gray-100 text-gray-500 hover:bg-gray-200">
        Missed Edge
    </button>
</div>

<!-- Incident List -->
<div id="incident-list" class="space-y-3 mb-6">
</div>

<!-- Pattern Summary -->
<div class="at-card p-5">
    <h2 class="text-base font-semibold text-gray-900 mb-2">Pattern Summary</h2>
    <div id="pattern-summary">
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/review.js"></script>
{% endblock %}
