<!DOCTYPE html>
<html lang="en" class="bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaTemp Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-panel: #1e293b;
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-line: #3b82f6;
            --amber-obs: #f59e0b;
            --alpha-bg: rgba(6, 78, 59, 0.5);
            --overpriced-bg: rgba(127, 29, 29, 0.5);
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-deep); color: var(--text-primary); }
        .mono { font-family: 'Space Mono', monospace; }
        .panel {
            background: var(--bg-panel);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 0.5rem;
        }
        .glow-dot {
            width: 6px; height: 6px; border-radius: 50%; background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        select {
            background: var(--bg-panel);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            border-radius: 0.375rem;
            padding: 0.375rem 0.75rem;
            outline: none;
        }
        select:focus { border-color: var(--blue-line); }
        .signal-alpha { background: var(--alpha-bg); }
        .signal-alpha-gap { background: rgba(6, 95, 70, 0.6); border-left: 3px solid #10b981; }
        .signal-overpriced { background: var(--overpriced-bg); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        /* Plotly container sizing */
        .chart-container { width: 100%; min-height: 340px; }
        @media (max-width: 1023px) {
            .chart-container { min-height: 280px; }
        }
        @media (max-width: 639px) {
            .chart-container { min-height: 220px; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="px-4 lg:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-2 border-b border-slate-700/50">
        <div class="flex items-center gap-3">
            <div class="glow-dot"></div>
            <h1 class="text-lg lg:text-xl font-semibold tracking-tight">
                AlphaTemp <span class="text-slate-400 font-light">Command Center</span>
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <select id="city-select" class="text-sm">
                <option value="NYC">NYC</option>
                <option value="PHL">PHL</option>
                <option value="CHI">CHI</option>
                <option value="MIA">MIA</option>
                <option value="LA">LA</option>
            </select>
            <input type="date" id="date-select" class="text-sm mono" style="background:var(--bg-panel); border:1px solid rgba(148,163,184,0.2); color:var(--text-primary); border-radius:0.375rem; padding:0.375rem 0.75rem;">
            <div id="clock" class="mono text-sm text-slate-400"></div>
        </div>
    </header>

    <main class="p-4 lg:p-6 space-y-4 lg:space-y-5 max-w-[1600px] mx-auto">
        <!-- Chart Row -->
        <div class="panel p-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-medium text-slate-300 uppercase tracking-widest">Forecast Ribbon</h2>
                <span id="ribbon-model-run" class="mono text-xs text-slate-500"></span>
            </div>
            <div id="ribbon-chart" class="chart-container"></div>
        </div>

        <!-- Data Feeds Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-5">
            <!-- Observation Feed -->
            <div class="panel p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-medium text-slate-300 uppercase tracking-widest">Observation Feed</h2>
                    <span id="obs-status" class="mono text-xs text-slate-500"></span>
                </div>
                <div class="overflow-x-auto" style="max-height:320px; overflow-y:auto;">
                    <table class="w-full text-sm">
                        <thead class="sticky top-0" style="background:var(--bg-panel);">
                            <tr class="border-b border-slate-700/50 text-left text-xs uppercase tracking-wider text-slate-400">
                                <th class="pb-2 pr-4">Time (ET)</th>
                                <th class="pb-2 pr-4">Station</th>
                                <th class="pb-2 pr-4">Temp &deg;F</th>
                                <th class="pb-2 pr-4">METAR</th>
                                <th class="pb-2">Ingested</th>
                            </tr>
                        </thead>
                        <tbody id="obs-body" class="mono text-xs"></tbody>
                    </table>
                </div>
            </div>
            <!-- Forecast Feed -->
            <div class="panel p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-medium text-slate-300 uppercase tracking-widest">Forecast Feed</h2>
                    <span id="fcst-status" class="mono text-xs text-slate-500"></span>
                </div>
                <div class="overflow-x-auto" style="max-height:320px; overflow-y:auto;">
                    <table class="w-full text-sm">
                        <thead class="sticky top-0" style="background:var(--bg-panel);">
                            <tr class="border-b border-slate-700/50 text-left text-xs uppercase tracking-wider text-slate-400">
                                <th class="pb-2 pr-4">Model Run</th>
                                <th class="pb-2 pr-4">Valid At (ET)</th>
                                <th class="pb-2 pr-4">Temp &deg;F</th>
                                <th class="pb-2 pr-4">Lead (hrs)</th>
                                <th class="pb-2">Ingested</th>
                            </tr>
                        </thead>
                        <tbody id="fcst-body" class="mono text-xs"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Market Intelligence -->
        <div class="panel p-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-medium text-slate-300 uppercase tracking-widest">Market Intelligence</h2>
                <span id="market-status" class="text-xs text-slate-500"></span>
            </div>
            <div id="market-table-wrap" class="overflow-x-auto">
                <p id="market-pending" class="text-sm text-slate-500 py-6 text-center">Market data pending</p>
                <table id="market-table" class="w-full text-sm hidden">
                    <thead>
                        <tr class="border-b border-slate-700/50 text-left text-xs uppercase tracking-wider text-slate-400">
                            <th class="pb-2 pr-4">Bracket</th>
                            <th class="pb-2 pr-4">Model Prob</th>
                            <th class="pb-2 pr-4">Market Mid</th>
                            <th class="pb-2 pr-4">Edge</th>
                            <th class="pb-2 pr-4">Bid</th>
                            <th class="pb-2">Ask</th>
                        </tr>
                    </thead>
                    <tbody id="market-body" class="mono text-xs"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
    // -----------------------------------------------------------------------
    // State
    // -----------------------------------------------------------------------
    let selectedCity = 'NYC';
    const PLOT_BG = '#1e293b';
    const GRID_COLOR = 'rgba(148,163,184,0.08)';
    const FONT_COLOR = '#94a3b8';

    // Convert UTC ISO string to Eastern Time ISO string (display only)
    function toET(utcStr) {
        const d = new Date(utcStr + 'Z');
        const et = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        return et.getFullYear() + '-' +
            String(et.getMonth()+1).padStart(2,'0') + '-' +
            String(et.getDate()).padStart(2,'0') + 'T' +
            String(et.getHours()).padStart(2,'0') + ':' +
            String(et.getMinutes()).padStart(2,'0') + ':' +
            String(et.getSeconds()).padStart(2,'0');
    }
    function nowET() {
        const d = new Date();
        const et = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        return et.getFullYear() + '-' +
            String(et.getMonth()+1).padStart(2,'0') + '-' +
            String(et.getDate()).padStart(2,'0') + 'T' +
            String(et.getHours()).padStart(2,'0') + ':' +
            String(et.getMinutes()).padStart(2,'0') + ':' +
            String(et.getSeconds()).padStart(2,'0');
    }

    const basePlotLayout = {
        paper_bgcolor: PLOT_BG,
        plot_bgcolor: PLOT_BG,
        font: { family: 'Space Mono, monospace', color: FONT_COLOR, size: 11 },
        margin: { t: 10, r: 20, b: 40, l: 50 },
        xaxis: { gridcolor: GRID_COLOR, zeroline: false },
        yaxis: { gridcolor: GRID_COLOR, zeroline: false },
    };

    const plotConfig = {
        displayModeBar: false,
        scrollZoom: false,
        responsive: true,
    };

    // -----------------------------------------------------------------------
    // Clock
    // -----------------------------------------------------------------------
    function updateClock() {
        const now = new Date();
        const et = now.toLocaleString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        document.getElementById('clock').textContent = et + ' ET';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Set date picker to today (ET)
    const todayET = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
    document.getElementById('date-select').value = todayET;
    document.getElementById('date-select').addEventListener('change', () => refreshSelectedCity());

    function getSelectedDate() {
        return document.getElementById('date-select').value || null;
    }

    // -----------------------------------------------------------------------
    // City Selection
    // -----------------------------------------------------------------------
    function selectCity(city) {
        selectedCity = city;
        document.getElementById('city-select').value = city;
        refreshSelectedCity();
    }

    document.getElementById('city-select').addEventListener('change', (e) => {
        selectCity(e.target.value);
    });

    // -----------------------------------------------------------------------
    // API Fetchers
    // -----------------------------------------------------------------------
    async function fetchJSON(url) {
        try {
            const r = await fetch(url);
            return await r.json();
        } catch (e) {
            console.error('Fetch error:', url, e);
            return null;
        }
    }

    // -----------------------------------------------------------------------
    // Ribbon Chart
    // -----------------------------------------------------------------------
    async function renderRibbon(city) {
        const dateParam = getSelectedDate() ? `?date=${getSelectedDate()}` : '';
        const data = await fetchJSON(`/api/forecast-curve/${city}${dateParam}`);
        if (!data || !data.forecasts.length) {
            Plotly.react('ribbon-chart', [], {
                ...basePlotLayout,
                annotations: [{ text: 'No forecast data', showarrow: false, font: { size: 14, color: FONT_COLOR }, xref: 'paper', yref: 'paper', x: 0.5, y: 0.5 }]
            }, plotConfig);
            document.getElementById('ribbon-model-run').textContent = '';
            return;
        }

        const fcstX = data.forecasts.map(p => toET(p.valid_at));
        const fcstY = data.forecasts.map(p => p.temp_f);
        const upperY = data.ribbon.map(p => p.upper_90);
        const lowerY = data.ribbon.map(p => p.lower_90);
        const ribbonX = data.ribbon.map(p => toET(p.valid_at));
        const ribbonStd = data.ribbon.map(p => p.std);
        const obsX = data.observations.map(p => toET(p.observed_at));
        const obsY = data.observations.map(p => p.temp_f);

        // Inner 50% CI bounds (z=0.674) — use original UTC keys for lookup
        const fcstMap = {};
        data.forecasts.forEach(p => { fcstMap[p.valid_at] = p.temp_f; });
        const innerUpperY = data.ribbon.map(p => {
            const center = fcstMap[p.valid_at] ?? ((p.upper_90 + p.lower_90) / 2);
            return Math.round((center + 0.674 * p.std) * 10) / 10;
        });
        const innerLowerY = data.ribbon.map(p => {
            const center = fcstMap[p.valid_at] ?? ((p.upper_90 + p.lower_90) / 2);
            return Math.round((center - 0.674 * p.std) * 10) / 10;
        });
        // Sigma lookup also uses original UTC keys
        const fcstStdMapUTC = {};
        data.ribbon.forEach(p => { fcstStdMapUTC[p.valid_at] = p.std; });

        // Outer 90% CI — upper bound (invisible anchor for fill)
        const traceUpper = {
            x: ribbonX, y: upperY,
            type: 'scatter', mode: 'lines',
            line: { width: 0 },
            showlegend: false, hoverinfo: 'skip',
        };
        // Outer 90% CI — lower bound (fill to upper)
        const traceLower = {
            x: ribbonX, y: lowerY,
            type: 'scatter', mode: 'lines',
            fill: 'tonexty',
            fillcolor: 'rgba(59,130,246,0.10)',
            line: { width: 0 },
            showlegend: false, hoverinfo: 'skip',
            name: '90% CI',
        };
        // Inner 50% CI — upper bound
        const traceInnerUpper = {
            x: ribbonX, y: innerUpperY,
            type: 'scatter', mode: 'lines',
            line: { width: 0 },
            showlegend: false, hoverinfo: 'skip',
        };
        // Inner 50% CI — lower bound (fill to inner upper)
        const traceInnerLower = {
            x: ribbonX, y: innerLowerY,
            type: 'scatter', mode: 'lines',
            fill: 'tonexty',
            fillcolor: 'rgba(59,130,246,0.22)',
            line: { width: 0 },
            showlegend: false, hoverinfo: 'skip',
            name: '50% CI',
        };
        // Forecast center line with sigma in hover
        const fcstSigma = data.forecasts.map(p => fcstStdMapUTC[p.valid_at] ?? null);
        const traceFcst = {
            x: fcstX, y: fcstY,
            type: 'scatter', mode: 'lines',
            line: { color: '#3b82f6', width: 2, dash: 'dot' },
            name: 'HRRR Forecast',
            customdata: fcstSigma,
            hovertemplate: '%{y:.1f}°F (σ=%{customdata:.2f})<extra></extra>',
        };
        // Observed actuals
        const traceObs = {
            x: obsX, y: obsY,
            type: 'scatter', mode: 'lines+markers',
            line: { color: '#f59e0b', width: 2 },
            marker: { size: 5, color: '#f59e0b' },
            name: 'Observed',
            hovertemplate: '%{y:.1f}°F<extra></extra>',
        };

        // "Now" vertical line (in ET)
        const nowShape = {
            type: 'line',
            x0: nowET(), x1: nowET(),
            y0: 0, y1: 1, yref: 'paper',
            line: { color: 'rgba(148,163,184,0.4)', width: 1, dash: 'dash' },
        };

        // Drift annotation: show how observations are running vs forecast
        const drift = data.drift || 0;
        const bias = data.bias || 0;
        const driftSign = drift >= 0 ? '+' : '';
        const biasSign = bias >= 0 ? '+' : '';
        const driftAnnotation = {
            text: `drift ${driftSign}${drift.toFixed(1)}°F  bias ${biasSign}${bias.toFixed(1)}°F`,
            showarrow: false,
            font: { size: 10, color: drift > 0 ? '#f59e0b' : drift < 0 ? '#3b82f6' : '#94a3b8' },
            xref: 'paper', yref: 'paper',
            x: 1, y: 1.02,
            xanchor: 'right',
        };

        // Date range: if a date is selected, set x-axis to midnight–midnight ET
        const xaxisConfig = { ...basePlotLayout.xaxis, type: 'date' };
        const selectedDate = getSelectedDate();
        if (selectedDate) {
            xaxisConfig.range = [selectedDate + 'T00:00:00', selectedDate + 'T23:59:59'];
        }

        const layout = {
            ...basePlotLayout,
            showlegend: true,
            legend: { x: 0, y: 1.02, orientation: 'h', font: { size: 10 } },
            yaxis: { ...basePlotLayout.yaxis, title: { text: '°F', standoff: 8, font: { size: 10 } } },
            xaxis: xaxisConfig,
            shapes: [nowShape],
            annotations: [driftAnnotation],
        };

        // Prior model runs as faded ghost lines
        const priorTraces = (data.prior_runs || []).map((run, i) => ({
            x: run.points.map(p => toET(p.valid_at)),
            y: run.points.map(p => p.temp_f),
            type: 'scatter', mode: 'lines',
            line: { color: 'rgba(59,130,246,0.25)', width: 1 },
            name: i === 0 ? 'Prior Runs' : undefined,
            showlegend: i === 0,
            legendgroup: 'prior',
            hovertemplate: '%{y:.1f}°F<extra>' + run.model_run + '</extra>',
        }));

        Plotly.react('ribbon-chart',
            [traceUpper, traceLower, traceInnerUpper, traceInnerLower,
             ...priorTraces, traceFcst, traceObs],
            layout, plotConfig);
        document.getElementById('ribbon-model-run').textContent = city;
    }

    // -----------------------------------------------------------------------
    // Market Intelligence
    // -----------------------------------------------------------------------
    async function refreshMarket(city) {
        const dateParam = getSelectedDate() ? `?date=${getSelectedDate()}` : '';
        const data = await fetchJSON(`/api/market/${city}${dateParam}`);
        const pending = document.getElementById('market-pending');
        const table = document.getElementById('market-table');
        const body = document.getElementById('market-body');
        const status = document.getElementById('market-status');

        if (!data || !data.available) {
            pending.classList.remove('hidden');
            table.classList.add('hidden');
            status.textContent = data?.message || 'Market data pending';
            return;
        }

        pending.classList.add('hidden');
        table.classList.remove('hidden');

        let gapCount = 0;
        body.innerHTML = data.comparisons.map(c => {
            // Alpha gap: model is 15%+ higher relative to market mid
            const isAlphaGap = c.signal === 'alpha' && c.market_mid !== null && c.market_mid > 0
                && (c.model_prob - c.market_mid) / c.market_mid >= 0.15;
            if (isAlphaGap) gapCount++;

            const rowClass = isAlphaGap ? 'signal-alpha-gap'
                : c.signal === 'alpha' ? 'signal-alpha'
                : c.signal === 'overpriced' ? 'signal-overpriced' : '';
            const edgeColor = c.edge > 0.05 ? 'text-emerald-400' : c.edge < -0.05 ? 'text-red-400' : 'text-slate-400';
            const edgeStr = c.edge !== null ? `${(c.edge * 100).toFixed(1)}pp` : '--';
            const signalLabel = isAlphaGap ? '◆ ALPHA GAP'
                : c.signal === 'alpha' ? '● BUY'
                : c.signal === 'overpriced' ? '● AVOID' : '○ FAIR';
            const signalColor = isAlphaGap ? 'text-emerald-300 font-bold'
                : c.signal === 'alpha' ? 'text-emerald-400'
                : c.signal === 'overpriced' ? 'text-red-400' : 'text-slate-500';

            return `<tr class="${rowClass} border-b border-slate-800/50">
                <td class="py-2 pr-4">${c.bracket}°F <span class="${signalColor} text-xs ml-1">${signalLabel}</span></td>
                <td class="py-2 pr-4">${(c.model_prob * 100).toFixed(1)}%</td>
                <td class="py-2 pr-4">${c.market_mid !== null ? (c.market_mid * 100).toFixed(1) + '%' : '--'}</td>
                <td class="py-2 pr-4 ${edgeColor}">${edgeStr}</td>
                <td class="py-2 pr-4 text-slate-400">${c.yes_bid ?? '--'}</td>
                <td class="py-2 text-slate-400">${c.yes_ask ?? '--'}</td>
            </tr>`;
        }).join('');

        const gapStr = gapCount > 0 ? ` · ${gapCount} alpha gap${gapCount > 1 ? 's' : ''}` : '';
        status.textContent = `${data.comparisons.length} brackets${gapStr}`;
    }

    // -----------------------------------------------------------------------
    // Observation Feed
    // -----------------------------------------------------------------------
    function formatETShort(utcStr) {
        if (!utcStr) return '--';
        const d = new Date(utcStr + 'Z');
        return d.toLocaleString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false });
    }

    async function refreshObsFeed(city) {
        const dateParam = getSelectedDate() ? `?date=${getSelectedDate()}` : '';
        const data = await fetchJSON(`/api/observations/${city}${dateParam}`);
        const body = document.getElementById('obs-body');
        const status = document.getElementById('obs-status');

        if (!data || !data.observations || data.observations.length === 0) {
            body.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-500">No observations</td></tr>';
            status.textContent = '';
            return;
        }

        body.innerHTML = data.observations.map(o => {
            const timeET = formatETShort(o.observed_at);
            const metar = o.raw_metar ? o.raw_metar.substring(0, 40) + (o.raw_metar.length > 40 ? '...' : '') : '--';
            const ingested = o.ingested_at ? formatETShort(o.ingested_at) : '--';
            return `<tr class="border-b border-slate-800/50">
                <td class="py-1.5 pr-4 text-slate-300">${timeET}</td>
                <td class="py-1.5 pr-4 text-slate-400">${o.station_id}</td>
                <td class="py-1.5 pr-4 text-amber-400">${o.temp_f.toFixed(1)}</td>
                <td class="py-1.5 pr-4 text-slate-500 text-[10px]" title="${o.raw_metar || ''}">${metar}</td>
                <td class="py-1.5 text-slate-500">${ingested}</td>
            </tr>`;
        }).join('');

        const highStr = data.running_high !== null
            ? ` · running high ${data.running_high.toFixed(1)}°F (${data.running_high_station})`
            : '';
        status.textContent = `${data.observations.length} obs${highStr}`;
    }

    // -----------------------------------------------------------------------
    // Forecast Feed
    // -----------------------------------------------------------------------
    async function refreshFcstFeed(city) {
        const dateParam = getSelectedDate() ? `?date=${getSelectedDate()}` : '';
        const data = await fetchJSON(`/api/forecast-points/${city}${dateParam}`);
        const body = document.getElementById('fcst-body');
        const status = document.getElementById('fcst-status');

        if (!data || !data.points || data.points.length === 0) {
            body.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-500">No forecast points</td></tr>';
            status.textContent = '';
            return;
        }

        let prevRun = null;
        body.innerHTML = data.points.map(p => {
            const runET = formatETShort(p.model_run);
            const validET = formatETShort(p.valid_at);
            const ingested = p.ingested_at ? formatETShort(p.ingested_at) : '--';
            const borderClass = prevRun !== null && p.model_run !== prevRun
                ? 'border-t-2 border-slate-600' : 'border-b border-slate-800/50';
            prevRun = p.model_run;
            return `<tr class="${borderClass}">
                <td class="py-1.5 pr-4 text-slate-400">${runET}z</td>
                <td class="py-1.5 pr-4 text-slate-300">${validET}</td>
                <td class="py-1.5 pr-4 text-blue-400">${p.temp_f.toFixed(1)}</td>
                <td class="py-1.5 pr-4 text-slate-500">${p.lead_hours}h</td>
                <td class="py-1.5 text-slate-500">${ingested}</td>
            </tr>`;
        }).join('');

        const latestStr = data.latest_run
            ? `Latest run ${formatETShort(data.latest_run)}z` : 'No runs';
        const highStr = data.forecast_high !== null
            ? ` · forecast high ${data.forecast_high.toFixed(1)}°F` : '';
        status.textContent = `${latestStr}${highStr}`;
    }

    // -----------------------------------------------------------------------
    // Orchestration
    // -----------------------------------------------------------------------
    async function refreshSelectedCity() {
        await Promise.all([
            renderRibbon(selectedCity),
            refreshObsFeed(selectedCity),
            refreshFcstFeed(selectedCity),
            refreshMarket(selectedCity),
        ]);
    }

    async function refreshAll() {
        await refreshSelectedCity();
    }

    // Initial load
    refreshAll();

    // Auto-refresh every 60 seconds
    setInterval(refreshAll, 60000);
    </script>
</body>
